<style>
  :root{
    --ground:#E7EAE3; --paper:#FBFCF9; --ink:#191D1A; --ink-soft:#5B655D;
    --hair:#C7CDC2; --verdigris:#2F6B60; --oxblood:#7A1220; --plate:#DDE2D8;
    --gap:clamp(1rem,3vw,2rem);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--ground);color:var(--ink);
    font-family:"Newsreader",Georgia,serif;font-size:17px;font-weight:400;line-height:1.6;
    padding:0 var(--gap) 5rem}
  .wrap{max-width:64rem;margin:0 auto}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:500;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft)}

  /* masthead + disc identification */
  .masthead{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;
    padding:1.4rem 0 1.1rem;border-bottom:1px solid var(--ink)}

    color:var(--ink);border-bottom-color:var(--ink)}
  .crumb{font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:500;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);margin:1.4rem 0 0}
  .crumb a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent}
  .crumb a:hover{color:var(--ink);border-bottom-color:var(--ink)}

  .doors{width:100%;display:grid;gap:.55rem;padding:.9rem 0 0}
  .find{position:relative}
  .find input,.scan input{
    width:100%;font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:500;
    padding:.5rem .6rem;border:1px solid var(--hair);background:var(--paper);color:var(--ink)}

  .find-panel{

    background:var(--paper);border:1px solid var(--ink);max-height:18rem;overflow:auto}
  .find-panel.open{display:block}
  .find-group{padding:.5rem .7rem .2rem;font-family:"IBM Plex Mono",monospace;font-size:.58rem;
    font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border-top:1px solid var(--hair)}
  .find-group:first-child{border-top:0}
  .find-hit{display:block;padding:.5rem .7rem;color:inherit;text-decoration:none}
  .find-hit:hover,.find-hit:focus-visible{background:var(--ground)}
  .find-hit .sub{display:block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:500;
    color:var(--ink-soft);margin-top:.12rem}
  .find-empty{padding:.65rem .7rem;font-size:.88rem;color:var(--ink-soft)}
  .scan{display:flex;gap:.4rem;align-items:center}
  .scan input{flex:1 1 12rem;min-width:0}
  .scan button{
    font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    padding:.55rem .7rem;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
  .scan button.ghost{background:none;color:var(--ink)}
  .scan-msg{width:100%;font-size:.8rem;color:var(--ink-soft);min-height:1.2rem}
  #cam{width:100%;max-width:22rem;margin-top:.6rem;display:none;border:1px solid var(--hair)}
  .door-lbl{font-family:"IBM Plex Mono",monospace;font-size:.58rem;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:.3rem}
  .work-dir{list-style:none;margin:2rem 0 0}
  .work-dir a{display:block;padding:1rem 0;border-bottom:1px solid var(--hair);
    color:inherit;text-decoration:none}
  .work-dir a:hover .w-title,.work-dir a:focus-visible .w-title{color:var(--verdigris)}
  .work-dir .w-title{font-family:"Bodoni Moda",serif;font-size:1.35rem;font-weight:500}
  .work-dir .sub{display:block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
    font-weight:500;color:var(--ink-soft);margin-top:.2rem}

  /* work */
  .work{padding:clamp(3rem,9vw,6rem) 0 0}
  .work-head{max-width:44rem}
  .work-head h2{font-family:"Bodoni Moda",serif;font-weight:400;
    font-size:clamp(2.6rem,8vw,4.6rem);line-height:.94;letter-spacing:-.015em;margin:.5rem 0 .35rem}
  .cat{font-family:"Bodoni Moda",serif;font-size:1.05rem;color:var(--ink-soft);font-style:italic}
  .standfirst{margin-top:1.1rem;font-size:1.05rem;color:var(--ink-soft);max-width:36rem}
  .strip{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin-top:1.6rem;padding-top:.7rem;
    border-top:1px solid var(--hair);font-family:"IBM Plex Mono",monospace;font-size:.7rem;
    letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase}

  .legend{margin-top:2.5rem;padding:1rem 1.1rem;background:var(--paper);border:1px solid var(--hair);
    display:grid;gap:.6rem;font-size:.86rem;color:var(--ink-soft)}
  .legend b{color:var(--ink);font-weight:500}
  .legend .swatch{display:inline-block;width:2.2rem;height:.55rem;vertical-align:middle;margin-right:.4rem}
  .sw-solid{background:var(--verdigris)}
  .sw-hatch{background:repeating-linear-gradient(135deg,var(--hair) 0 3px,var(--paper) 3px 6px);border:1px solid var(--hair)}

  /* entry */
  .entry{display:grid;grid-template-columns:200px 1fr;gap:0 2rem;padding:2.4rem 0;border-top:1px solid var(--hair)}
  .entry:first-of-type{border-top:1px solid var(--ink)}
  .plate{width:200px;height:200px;position:relative;background:var(--plate);
    border:1px solid var(--hair);overflow:hidden}
  .plate img{position:absolute;inset:0;z-index:1;width:100%;height:100%;
    object-fit:cover;display:block;background:var(--plate)}
  .plate-fallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;
    justify-content:space-between;padding:.85rem;box-shadow:inset 0 0 0 1px var(--paper)}
  .plate.has-art .plate-fallback{visibility:hidden}
  .plate-fallback .lbl{font-family:"Bodoni Moda",serif;font-weight:500;font-size:1.05rem;line-height:1.15}
  .plate-fallback .yr{font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:500;color:var(--ink-soft)}
  .plate-cap{margin-top:.45rem;font-family:"IBM Plex Mono",monospace;font-size:.58rem;font-weight:500;
    letter-spacing:.06em;color:var(--ink-soft);max-width:200px}

  .head-line{font-size:1.14rem;font-weight:500;line-height:1.42;margin-bottom:.85rem}
  .head-line .dir{font-weight:600}
  .head-line .pub{color:var(--ink-soft);font-weight:400}

  /* Morningstar-style score matrix: four cells, one glance */
  .scorebox{display:grid;grid-template-columns:1fr 1fr;max-width:28rem;margin:0 0 1.35rem;
    border:1px solid var(--ink);background:var(--paper)}
  .scorebox .cell{padding:.7rem .85rem .75rem;min-height:5.1rem;
    display:flex;flex-direction:column;justify-content:space-between;gap:.35rem}
  .scorebox .cell:nth-child(odd){border-right:1px solid var(--hair)}
  .scorebox .cell:nth-child(-n+2){border-bottom:1px solid var(--hair)}
  .scorebox .k{font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  .scorebox .v{font-family:"Bodoni Moda",serif;font-weight:500;font-size:1.55rem;line-height:1;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .scorebox .v.muted{font-size:1.05rem;color:var(--ink-soft)}
  .scorebox .sub{font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:500;
    color:var(--ink-soft);letter-spacing:.03em}
  .scorebox .stars{font-size:1.15rem;letter-spacing:.14em;line-height:1;color:var(--ink)}
  .scorebox .stars .off{color:var(--hair)}
  .scorebox .badge{align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
    font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--paper);
    background:var(--oxblood);padding:.25rem .45rem}
  .scorebox .meter{display:block;width:100%;height:.5rem;background:var(--hair);margin-top:.15rem}
  .scorebox .meter i{display:block;height:100%;background:var(--verdigris)}
  .verdict{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;margin-bottom:.4rem}
  .stars{font-size:1.05rem;letter-spacing:.12em;line-height:1}
  .stars .off{color:var(--hair)}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:500;letter-spacing:.13em;
    text-transform:uppercase;color:var(--paper);background:var(--oxblood);padding:.2rem .45rem}

  .commentary{max-width:38rem;margin-bottom:1.3rem}

  /* signed editorial entry — ADR-002. No shared furniture with the aggregate. */
  .signed{
    background:var(--paper);border-top:2px solid var(--ink);border-bottom:1px solid var(--hair);
    padding:1.5rem clamp(1rem,3vw,2rem) 1.2rem;margin:0 0 1.6rem;max-width:42rem}
  .signed .kicker{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--oxblood);margin-bottom:.9rem}
  .signed .body{font-size:1.06rem;line-height:1.62;text-align:justify;hyphens:auto}
  .signed .body p+p{margin-top:.8rem;text-indent:1.2rem}
  .signed .sig{margin-top:1rem;text-align:right;font-family:"Bodoni Moda",serif;
    font-style:italic;font-size:.95rem}
  .signed .sig span{font-family:"IBM Plex Mono",monospace;font-style:normal;
    font-size:.6rem;color:var(--ink-soft);letter-spacing:.08em;margin-left:.5rem}
  .signed .verdict{border-bottom:0;padding-bottom:.4rem;margin-bottom:.9rem}
  .diverge{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.05em;
    color:var(--oxblood);border-left:2px solid var(--oxblood);padding-left:.6rem;margin:.9rem 0 0}
  .unsigned{max-width:42rem;margin-bottom:1.5rem;padding:.9rem 1rem;
    border:1px dashed var(--hair);font-size:.88rem;color:var(--ink-soft)}

  .credits{border-left:2px solid var(--hair);padding:.15rem 0 .15rem .8rem;margin-bottom:1.4rem;
    font-size:.9rem;font-weight:400;color:var(--ink-soft);max-width:38rem}
  .credits b{color:var(--ink);font-weight:600}
  .unknown{font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:500;
    letter-spacing:.06em;color:var(--oxblood)}

  .modlabel{font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 .5rem}

  .anchors{list-style:none;margin-bottom:1.6rem;max-width:38rem;display:grid;gap:.7rem}
  .anchors li{padding-left:.9rem;border-left:1px solid var(--verdigris)}
  .anchors .where{font-family:"Bodoni Moda",serif;font-size:.92rem;display:block}
  .anchors .what{font-size:.92rem;color:var(--ink-soft)}
  .anchors .t{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-soft)}

  /* C: couplings sit on the recording card, never as a work-page related rail. */
  .on-disc{list-style:none;margin:0 0 1.6rem;max-width:38rem;display:grid;gap:.45rem}
  .on-disc li{padding-left:.9rem;border-left:1px solid var(--hair)}
  .on-disc a{color:inherit;text-decoration:none;font-family:"Bodoni Moda",serif;font-size:.95rem}
  .on-disc a:hover,.on-disc a:focus-visible{color:var(--verdigris)}
  .on-disc .sub{display:block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
    font-weight:500;color:var(--ink-soft);margin-top:.12rem}

  table{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.82rem}
  th{text-align:left;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:.58rem;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
    padding:.35rem .5rem .35rem 0;border-bottom:1px solid var(--ink)}
  td{padding:.5rem .5rem .5rem 0;border-bottom:1px solid var(--hair);vertical-align:top}
  td.num{font-family:"IBM Plex Mono",monospace;font-size:.74rem;white-space:nowrap}
  tr.hit{background:var(--paper);box-shadow:inset 3px 0 0 var(--oxblood)}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.08em;
    text-transform:uppercase;padding:.15rem .4rem;white-space:nowrap;border:1px solid currentColor}
  .chip.good{color:var(--verdigris)}
  .chip.mid{color:var(--ink-soft)}
  .chip.bad{color:var(--oxblood)}
  .chip.none{color:var(--ink-soft);border-style:dashed}
  .prov{font-family:"IBM Plex Mono",monospace;font-size:.58rem;font-weight:500;letter-spacing:.06em;color:var(--ink-soft)}
  .prov.draft{color:var(--oxblood)}
  a.cite{color:var(--verdigris);font-weight:500;text-decoration:none;border-bottom:1px solid var(--verdigris)}
  a.cite:hover,a.cite:focus-visible{color:var(--ink);border-bottom-color:var(--ink)}
  .cite-loc{font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:500;color:var(--ink);
    word-break:break-word}

  .ev-label{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:.35rem}
  .influence{display:flex;height:30px;background:var(--paper);border:1px solid var(--hair);overflow:hidden}
  .seg{position:relative;min-width:0;display:flex;align-items:center;background:var(--verdigris);
    border-right:1px solid var(--paper);padding:0 .35rem;overflow:hidden;
    font-family:"IBM Plex Mono",monospace;font-size:.58rem;color:var(--paper);white-space:nowrap}
  .seg:last-child{border-right:0}
  .seg.flag{background:repeating-linear-gradient(135deg,var(--hair) 0 3px,var(--paper) 3px 6px);color:var(--ink-soft)}
  .agreement{position:relative;height:52px;margin-top:1.1rem}
  .axis{position:absolute;left:0;right:0;top:26px;height:1px;background:var(--hair)}
  .thresh{position:absolute;top:8px;bottom:14px;width:0;border-left:1px dashed var(--ink-soft)}
  .thresh span{position:absolute;top:-.2rem;left:.3rem;font-family:"IBM Plex Mono",monospace;
    font-size:.55rem;color:var(--ink-soft)}
  .agg{position:absolute;top:6px;bottom:12px;width:2px;background:var(--ink)}
  .agg span{position:absolute;bottom:-1.05rem;left:50%;transform:translateX(-50%);
    font-family:"IBM Plex Mono",monospace;font-size:.6rem;white-space:nowrap}
  .dot{position:absolute;top:26px;border-radius:50%;background:var(--verdigris);transform:translate(-50%,-50%)}
  .dot.flag{background:var(--paper);border:1px solid var(--hair)}
  .axis-ends{position:absolute;left:0;right:0;top:34px;display:flex;justify-content:space-between;
    font-family:"IBM Plex Mono",monospace;font-size:.55rem;color:var(--ink-soft)}

  .period{display:grid;grid-template-columns:5.5rem 1fr;gap:.3rem .9rem;padding:.5rem 0;border-bottom:1px solid var(--hair)}
  .period:last-child{border-bottom:0}
  .period .dec{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.06em;color:var(--ink-soft);padding-top:.2rem}
  .period .txt{font-size:.92rem}

  details{margin-top:1.4rem;border-top:1px solid var(--hair);padding-top:.7rem}
  summary{cursor:pointer;list-style:none;font-family:"IBM Plex Mono",monospace;font-size:.63rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+ "}
  details[open] summary::before{content:"− "}
  summary:hover,summary:focus-visible{color:var(--ink)}

  footer{margin-top:5rem;padding-top:1.2rem;border-top:1px solid var(--ink);
    font-size:.82rem;color:var(--ink-soft);display:grid;gap:.6rem;max-width:44rem}
  footer a{color:var(--ink-soft)}
  footer .mono{font-size:.68rem;letter-spacing:.04em}
  :focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}

  @media (max-width:680px){
    body{font-size:16px}
    .entry{grid-template-columns:1fr;gap:1.1rem}
    .plate{width:152px;height:152px}
    .plate-cap{max-width:152px}
    .scorebox{max-width:none}
    .scorebox .v{font-size:1.35rem}
    .period{grid-template-columns:1fr}
    table{font-size:.78rem}
  }
  @media (prefers-reduced-motion:no-preference){
    .seg,.dot{animation:fade .5s ease both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }
</style>

rature", "class": "secondary literature", "provenance": "attributed", "score": 2.75, "weight": 0.525, "conflict": false, "text": "Strongly recommended stereo account; Te Deum and Act III prelude especially imposing.", "locator": null}], "algorithm_version": "2.0", "built": "2026-09-05", "on_this_disc": []}], "composer_id": "puccini"}], "barcode_index": {}};
const WORK_INDEX = [];
const BASE = "../";

const DOMAIN=[2.40,3.00], THRESHOLD=2.70;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pos=v=>((v-DOMAIN[0])/(DOMAIN[1]-DOMAIN[0]))*100;
const CHIP={"preferred transfer":"good","sound and serviceable":"mid","pass if you can":"bad","not yet assessed":"none"};

function coverEdition(r){
  const withMbid=(r.editions||[]).filter(e=>e.mbid);
  if(!withMbid.length) return null;
  const want=parseInt((String(r.published).match(/\d{4}/)||[])[0]||"",10);
  if(!want) return withMbid[0];
  return withMbid.slice().sort((a,b)=>{
    const ya=parseInt((String(a.year).match(/\d{4}/)||[])[0]||"9999",10);
    const yb=parseInt((String(b.year).match(/\d{4}/)||[])[0]||"9999",10);
    return Math.abs(ya-want)-Math.abs(yb-want);
  })[0];
}

function plate(r){
  const ed=coverEdition(r);
  const label=esc((r.published.split(",")[0]||"").trim());
  const year=esc((r.published.split(",").pop()||"").trim());
  const fb=`<div class="plate-fallback" aria-hidden="true"><span class="lbl">${label}</span>
    <span class="yr">${year}${ed?"":" · no front cover"}</span></div>`;
  if(!ed) return `<div><div class="plate empty">${fb}</div>
    <p class="plate-cap">No Cover Art Archive front yet</p></div>`;
  const src=`https://coverartarchive.org/release/${ed.mbid}/front-500`;
  const img=`<img src="${src}"
    srcset="https://coverartarchive.org/release/${ed.mbid}/front-250 250w, ${src} 500w"
    sizes="200px" alt="Front cover — ${label}, ${year}" loading="lazy"
    onload="this.parentElement.classList.add('has-art')"
    onerror="this.remove()">`;
  const edYear=esc(String(ed.year||year));
  const edLabel=esc(ed.label||"");
  return `<div><div class="plate">${fb}${img}</div>
    <p class="plate-cap">${edLabel}${edLabel&&edYear?" · ":""}${edYear}</p></div>`;
}

function scorebox(r){
  const un=r.interpretation===null;
  const st=[0,1,2].map(i=>`<span class="${!un&&i<r.stars?"on":"off"}">★</span>`).join("");
  const conf=un?null:r.confidence;
  const confPct=conf==null?0:Math.max(0,Math.min(100,conf*100));
  const sound=r.sound_best;
  const soundCell=sound==null
    ?`<span class="v muted">—</span><span class="sub">not yet assessed</span>`
    :`<span class="v">${sound.toFixed(2)}</span><span class="sub">best edition</span>`;
  const interpCell=un
    ?`<span class="v muted">—</span><span class="sub">awaiting sources</span>`
    :`<span class="stars" aria-label="${r.stars} of 3 stars">${st}</span>
       <span class="v">${r.interpretation.toFixed(3)}</span>`;
  const stand=r.reference
    ?`<span class="badge">Référence</span><span class="sub">interpretation only</span>`
    :`<span class="v muted">—</span><span class="sub">${un?"awaiting sources":"not a référence"}</span>`;
  return `<div class="scorebox" role="group" aria-label="Recording scores">
    <div class="cell"><span class="k">Interpretation</span>${interpCell}</div>
    <div class="cell"><span class="k">Sound</span>${soundCell}</div>
    <div class="cell"><span class="k">Confidence</span>
      <span class="v">${conf==null?"—":conf.toFixed(2)}</span>
      <span class="meter" aria-hidden="true"><i style="width:${confPct.toFixed(0)}%"></i></span>
    </div>
    <div class="cell"><span class="k">Standing</span>${stand}</div>
  </div>`;
}

function credits(c){
  const miss=`<span class="unknown">not established — contribute</span>`;
  return `<p class="credits">
    <b>${esc(c.venue)}</b>, ${esc(c.sessions)}.
    Producer ${c.producer?esc(c.producer):miss}. Engineer ${c.engineer?esc(c.engineer):miss}.
    <span class="prov${c.status==="cited"?"":" draft"}">credits ${esc(c.status)}</span>
  </p>`;
}

function anchors(list){
  return `<p class="modlabel">What to listen for</p><ul class="anchors">${list.map(a=>`
    <li><span class="where">${esc(a.where)}</span>
      <span class="what">${esc(a.listen_for)}</span>
      ${a.timing?`<span class="t">${esc(a.timing)}</span>`:""}</li>`).join("")}</ul>`;
}

function onThisDisc(r){
  /* Card only. Empty means this release does not share a barcode or
     release MBID with another assessed work — not a missing related feed. */
  const items=r.on_this_disc||[];
  if(!items.length) return "";
  const lis=items.map(w=>{
    const label=esc(w.title||w.work_id);
    const sub=[w.composer,w.edition_label].filter(Boolean).map(esc).join(" · ");
    const title=w.anchor
      ?`<a href="${esc(BASE)}works/${esc(w.anchor)}.html">${label}</a>`
      :`<span>${label}</span>`;
    return `<li>${title}${sub?`<span class="sub">${sub}</span>`:""}</li>`;
  }).join("");
  return `<p class="modlabel">On this disc</p><ul class="on-disc">${lis}</ul>`;
}

function editions(r){
  const rows=r.editions.map(e=>`
    <tr id="ed-${esc(e.id)}">
      <td>${esc(e.label)} <span class="num">${esc(e.catno)}</span><br>
        <span class="prov">${esc(e.format)}${e.verified?"":" · catalogue data unverified"}</span></td>
      <td class="num">${esc(e.year)}</td>
      <td>${esc(e.transfer)}</td>
      <td class="num">${e.sound!=null?e.sound.toFixed(2):"—"}</td>
      <td><span class="chip ${CHIP[e.verdict]||"none"}">${esc(e.verdict)}</span></td>
      <td class="num">${e.barcode?esc(e.barcode):'<span class="prov draft">missing</span>'}</td>
    </tr>`).join("");
  const assessed=r.editions.filter(e=>e.sound!=null).length;
  return `<p class="modlabel">Editions and transfers — ${assessed} of ${r.editions.length} assessed</p>
    <table><thead><tr><th>Edition</th><th>Year</th><th>What it did to the sound</th>
    <th>Sound</th><th>Verdict</th><th>Barcode</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function influence(r){
  const tot=r.sources.reduce((a,s)=>a+s.weight,0)||1;
  return r.sources.map(s=>{
    const pct=(s.weight/tot)*100;
    const shade=45+55*((s.score-DOMAIN[0])/(DOMAIN[1]-DOMAIN[0]));
    const style=s.conflict?`flex:0 0 ${pct}%`
      :`flex:0 0 ${pct}%;background:color-mix(in srgb, var(--verdigris) ${Math.round(shade)}%, #8FA9A2)`;
    const cite=s.locator?`, ${s.locator}`:"";
    return `<div class="seg${s.conflict?" flag":""}" style="${style}"
      title="${esc(s.source)} — ${esc(s.class)}, ${esc(s.provenance)}, score ${s.score.toFixed(2)}, weight ${s.weight.toFixed(2)}${esc(cite)}">
      ${pct>14?s.weight.toFixed(2):""}</div>`;
  }).join("");
}

function agreement(r){
  const dots=r.sources.map(s=>{const d=5+s.weight*11;
    return `<div class="dot${s.conflict?" flag":""}" style="left:${pos(s.score).toFixed(2)}%;
      width:${d.toFixed(1)}px;height:${d.toFixed(1)}px" title="${esc(s.source)} — ${s.score.toFixed(2)}"></div>`;
  }).join("");
  return `<div class="agreement"><div class="axis"></div>
    <div class="thresh" style="left:${pos(THRESHOLD).toFixed(2)}%"><span>2.70</span></div>${dots}
    <div class="agg" style="left:${pos(r.interpretation).toFixed(2)}%"><span>S ${r.interpretation.toFixed(3)}</span></div>
    <div class="axis-ends"><span>${DOMAIN[0].toFixed(2)}</span><span>${DOMAIN[1].toFixed(2)}</span></div></div>`;
}

function reception(r){
  return `<details><summary>How its reputation was made (${r.reception.length} periods)</summary>
    ${r.reception.map(p=>`<div class="period"><span class="dec">${esc(p.decade)}</span>
      <span class="txt">${esc(p.note)}</span></div>`).join("")}</details>`;
}

function citationCell(s){
  const loc=s.locator;
  if(!loc) return `<span class="prov draft">no locator</span>`;
  if(/^https?:\/\//i.test(loc))
    return `<a class="cite" href="${esc(loc)}" target="_blank" rel="noopener noreferrer">open source</a>
      <br><span class="prov">${esc(loc.replace(/^https?:\/\//i,"").split("/")[0])}</span>`;
  return `<span class="cite-loc">${esc(loc)}</span>`;
}

function sourceLabel(s){
  const loc=s.locator;
  if(loc && /^https?:\/\//i.test(loc))
    return `<a class="cite" href="${esc(loc)}" target="_blank" rel="noopener noreferrer">${esc(s.source)}</a>`;
  return esc(s.source);
}

function sources(r){
  const cited=r.sources.filter(s=>s.locator).length;
  return `<details open>
    <summary>Sources behind the interpretation score (${r.sources.length}${cited?` · ${cited} with locator`:""})</summary>
    <table><thead><tr><th>Source</th><th>Citation</th><th>Provenance</th><th>Score</th><th>Weight</th><th>Interest</th></tr></thead>
    <tbody>${r.sources.map(s=>`<tr>
      <td>${sourceLabel(s)}<br><span class="prov">${esc(s.class)}</span></td>
      <td>${citationCell(s)}</td>
      <td><span class="prov${s.provenance==="draft"?" draft":""}">${esc(s.provenance)}</span></td>
      <td class="num">${s.score.toFixed(2)}</td>
      <td class="num">${s.weight.toFixed(2)}</td>
      <td class="num">${s.conflict?'<span class="prov draft">down-weighted</span>':"—"}</td>
    </tr>`).join("")}</tbody></table>
    <p class="prov" style="margin-top:.7rem">A locator (URL, issue, or page) is what makes a claim <b>cited</b>.
      Named sources without one stay <b>attributed</b> — they are not linked because no receipt is on file.</p>
  </details>`;
}

function signed(r){
  const e = r.editorial;
  if(!e) return `<div class="unsigned">No signed entry yet. The aggregate below is the
    weighted consensus of published sources; it is not a listening report.</div>`;
  const st=[0,1,2].map(i=>`<span class="${i<e.stars?"on":"off"}">★</span>`).join("");
  const paras = String(e.text).split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join("");
  const div = Number.isFinite(r.divergence) && r.divergence!==0
    ? `<p class="diverge">The weighted consensus gives ${r.stars} ★ here. The signed entry gives
       ${e.stars}. The disagreement is deliberate; the reasoning is above.</p>` : "";
  return `<div class="signed">
    <p class="kicker">Signed entry</p>
    <div class="verdict"><span class="stars">${st}</span>
      ${e.reference?'<span class="badge">Référence</span>':""}</div>
    <div class="body">${paras}</div>
    <p class="sig">${esc(e.author.name || e.author.id)}
      <span>${esc(e.date)} · rev ${e.revision}</span></p>
    ${div}
  </div>`;
}

function identityLine(r){
  /* Performers and label as seeded. Aggregate furniture stays off this card.
     A Critic-signed entry (ADR-002) renders when present. */
  const who=[r.soloists,r.director,r.ensemble].filter(Boolean).map(esc).join(" — ");
  return `<article class="entry identity" id="${esc(r.id)}">
    ${plate(r)}
    <div>
      <p class="head-line">${who||esc(r.id)} <span class="pub">(${esc(r.published)})</span></p>
      ${r.editorial?signed(r):""}
    </div>
  </article>`;
}

function entry(r){
  if(r.card==="identity") return identityLine(r);
  const un = r.interpretation===null;
  return `<article class="entry" id="${esc(r.id)}">
    ${plate(r)}
    <div>
      <p class="head-line">${esc(r.soloists)} — <span class="dir">${esc(r.director)}</span> —
        ${esc(r.ensemble)} <span class="pub">(${esc(r.published)})</span></p>
      ${scorebox(r)}
      ${signed(r)}\n      ${credits(r.engineering)}
      ${anchors(r.anchors)}
      ${editions(r)}
      ${onThisDisc(r)}
      ${un?"":`<p class="ev-label" style="margin-top:1.6rem">Influence — who the interpretation verdict rests on</p>
      <div class="influence">${influence(r)}</div>
      <p class="ev-label" style="margin-top:1.1rem">Agreement — where each source landed</p>
      ${agreement(r)}`}
      ${reception(r)}
      ${sources(r)}
    </div>
  </article>`;
}

const workDomId=w=>String(w.id).replace(/\//g,"_");

/* A: work pages are sealed to one work (composer + catalogue / work_id).
   Never render another work beside this one. Empty related is correct.
   Title fragments such as a shared number must not pull another composer in.
   C: On this disc is rendered inside entry() only — not as a work-level feed. */
function composerSlug(w){
  if(w.composer_id) return String(w.composer_id);
  const id=String(w.id||"");
  return id.includes("/")?id.split("/")[0]:id.split("_")[0];
}

(function redirectLegacyHash(){
  const raw=(location.hash||"").replace(/^#/,"");
  if(!raw || !WORK_INDEX.length) return;
  const hit=WORK_INDEX.find(w=>w.anchor===raw || (w.recordings||[]).includes(raw));
  if(!hit) return;
  const dest=`${BASE}works/${hit.anchor}.html`+(hit.anchor!==raw?"#"+raw:"");
  location.replace(dest);
})();

function workSection(w){
  const recs=w.recordings||[];
  const identity=recs.length>0 && recs.every(r=>r.card==="identity");
  if(identity){
    return `<section class="work" id="${esc(workDomId(w))}">
      <div class="work-head">
        <p class="eyebrow">${esc(w.composer)} · ${esc(w.dates)}</p>
        <h2>${esc(w.title)}</h2>
        <p class="cat">${esc(w.cat)}</p>
        ${w.standfirst?`<p class="standfirst">${esc(w.standfirst)}</p>`:""}
        <p class="strip"><span>${recs.length} recordings</span></p>
      </div>
      ${recs.map(identityLine).join("")}
    </section>`;
  }
  const refs=recs.filter(r=>r.reference).length;
  const eds=recs.reduce((a,r)=>a+(r.editions||[]).length,0);
  return `<section class="work" id="${esc(workDomId(w))}">
    <div class="work-head">
      <p class="eyebrow">${esc(w.composer)} · ${esc(w.dates)}</p>
      <h2>${esc(w.title)}</h2>
      <p class="cat">${esc(w.cat)}</p>
      <p class="standfirst">${esc(w.standfirst)}</p>
      <p class="strip"><span>${recs.length} recordings</span>
        <span>${eds} editions tracked</span><span>${refs} référence</span></p>
    </div>
    <div class="legend">
      <p><span class="swatch sw-solid"></span><b>Influence</b> — bar widths are each source's share of the verdict. Darker means it rated the recording higher.</p>
      <p><span class="swatch sw-hatch"></span><b>Hatched</b> — the source sells the recording, so its weight is cut and it takes up almost no width.</p>
      <p><b>Sound is scored per edition</b>, not per recording. A great performance in a bad transfer is a bad purchase.</p>
      <p><b>Citation</b> — a source links only when a locator is on file (URL, issue, or page). No locator means attributed, not linked.</p>
    </div>
    ${recs.map(entry).join("")}
  </section>`;
}

function renderWorkDirectory(index){
  const items=index.map(w=>`<li>
    <a href="${esc(BASE)}works/${esc(w.anchor)}.html">
      <span class="w-title">${esc(w.title)}</span>
      <span class="sub">${esc(w.composer)} · ${esc(w.cat)} · ${(w.recordings||[]).length} recordings</span>
    </a>
  </li>`).join("");
  return `<section class="work">
    <div class="work-head">
      <p class="eyebrow">Assessed works</p>
      <h2>Entries</h2>
      <p class="standfirst">Each title opens its own page. This list is a directory.</p>
    </div>
    <ul class="work-dir">${items}</ul>
  </section>`;
}

const pageWorks=CATALOGUE.works||[];
document.getElementById("works").innerHTML = pageWorks.length
  ? pageWorks.map(workSection).join("")
  : (WORK_INDEX.length ? renderWorkDirectory(WORK_INDEX) : "");

document.getElementById("buildline").textContent =
  `ALGORITHM V${CATALOGUE.algorithm_version} · BUILT ${CATALOGUE.built} · ${Object.keys(CATALOGUE.barcode_index||{}).length} BARCODES INDEXED · NO TRACKERS, NO AFFILIATE LINKS`;

/* ---- find by name: only what this page actually carries ---- */
const FIND_INDEX=[];
const seenComposer=new Set();
for(const w of pageWorks){
  const wid=workDomId(w);
  const surname=(w.composer||"").split(" ").pop();
  if(!seenComposer.has(w.composer)){
    seenComposer.add(w.composer);
    FIND_INDEX.push({kind:"composer",label:w.composer,sub:`${w.dates||""}`.trim(),
      href:`${BASE}composers/${composerSlug(w)}.html`,keys:`${w.composer} ${surname}`.toLowerCase()});
  }
  FIND_INDEX.push({kind:"work",label:w.title,sub:`${w.composer} · ${w.cat}`,
    href:"#"+wid,keys:`${w.title} ${w.cat} ${w.composer} ${surname}`.toLowerCase()});
  for(const r of w.recordings){
    const who=[r.director,r.ensemble,r.soloists].filter(Boolean).join(" / ");
    FIND_INDEX.push({kind:"recording",label:who||r.id,
      sub:`${w.composer} · ${w.title} · ${r.published||""}`,
      href:"#"+r.id,
      keys:`${who} ${r.published||""} ${w.title} ${w.composer}`.toLowerCase()});
  }
}
if(!pageWorks.length){
  for(const w of WORK_INDEX){
    const surname=(w.composer||"").split(" ").pop();
    FIND_INDEX.push({kind:"work",label:w.title,sub:`${w.composer} · ${w.cat}`,
      href:`${BASE}works/${w.anchor}.html`,
      keys:`${w.title} ${w.cat} ${w.composer} ${surname}`.toLowerCase()});
  }
}
const KIND_ORDER={composer:0,work:1,recording:2};
const KIND_LABEL={composer:"Composers",work:"Works",recording:"Recordings"};
const qInput=document.getElementById("q"), qPanel=document.getElementById("q-panel");
function nameSearch(q){
  q=q.trim().toLowerCase().replace(/\s+/g," ");
  if(q.length<2) return [];
  const tokens=q.split(" ");
  return FIND_INDEX.filter(item=>tokens.every(t=>item.keys.includes(t)))
    .sort((a,b)=>KIND_ORDER[a.kind]-KIND_ORDER[b.kind]||a.label.localeCompare(b.label))
    .slice(0,20);
}
function renderNameHits(hits){
  if(!qInput.value.trim()){qPanel.classList.remove("open");qPanel.innerHTML="";return;}
  if(!hits.length){
    qPanel.classList.add("open");
    qPanel.innerHTML=`<p class="find-empty">Nothing on this page matches. Try the <a href="${BASE}index.html">catalogue</a>.</p>`;
    return;
  }
  let html="",kind=null;
  for(const h of hits){
    if(h.kind!==kind){kind=h.kind;html+=`<p class="find-group">${KIND_LABEL[kind]}</p>`;}
    html+=`<a class="find-hit" href="${esc(h.href)}"><span class="lbl">${esc(h.label)}</span>
      <span class="sub">${esc(h.sub)}</span></a>`;
  }
  qPanel.classList.add("open"); qPanel.innerHTML=html;
}
qInput.addEventListener("input",()=>renderNameHits(nameSearch(qInput.value)));
qInput.addEventListener("keydown",e=>{
  if(e.key==="Escape"){qPanel.classList.remove("open");qInput.blur();}
  if(e.key==="Enter"){const first=qPanel.querySelector(".find-hit"); if(first){e.preventDefault();first.click();}}
});
document.addEventListener("click",e=>{if(!e.target.closest(".find")) qPanel.classList.remove("open");});

/* ---- identify a disc: barcode or catalogue number, matched offline ---- */
const msg=document.getElementById("bc-msg");
function lookup(raw){
  const q=String(raw||"").trim();
  if(!q){msg.textContent="";return;}
  document.querySelectorAll("tr.hit").forEach(t=>t.classList.remove("hit"));
  const digits=q.replace(/\D/g,"");
  let hit=digits && CATALOGUE.barcode_index[digits];
  if(!hit){
    for(const w of CATALOGUE.works) for(const r of w.recordings) for(const e of r.editions){
      if(e.catno && e.catno!=="—" && e.catno.toLowerCase().replace(/\s/g,"")===q.toLowerCase().replace(/\s/g,""))
        hit={recording:r.id,edition:e.id};
    }
  }
  if(!hit){
    msg.innerHTML=`Not in the catalogue yet. ${digits.length>=8?
      `<a href="https://musicbrainz.org/search?query=${encodeURIComponent(digits)}&type=release">Look it up on MusicBrainz</a> and add it.`:
      "Try the full barcode, or the catalogue number printed on the spine."}`;
    return;
  }
  const row=document.getElementById("ed-"+hit.edition);
  row.classList.add("hit");
  row.scrollIntoView({block:"center"});
  const verdict=row.querySelector(".chip").textContent.trim();
  msg.textContent=`Matched — ${verdict}. Highlighted below.`;
}
document.getElementById("bc-go").addEventListener("click",()=>lookup(document.getElementById("bc").value));
document.getElementById("bc").addEventListener("keydown",e=>{if(e.key==="Enter")lookup(e.target.value);});

/* Camera scanning where the browser supports it; typing always works. */
const camBtn=document.getElementById("bc-cam"), video=document.getElementById("cam");
if("BarcodeDetector" in window){
  camBtn.hidden=false;
  camBtn.addEventListener("click",async()=>{
    try{
      const det=new BarcodeDetector({formats:["ean_13","upc_a","ean_8"]});
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      video.srcObject=stream; video.style.display="block"; await video.play();
      msg.textContent="Point at the barcode on the back of the case.";
      const tick=async()=>{
        if(!video.srcObject) return;
        const found=await det.detect(video).catch(()=>[]);
        if(found.length){
          stream.getTracks().forEach(t=>t.stop());
          video.srcObject=null; video.style.display="none";
          document.getElementById("bc").value=found[0].rawValue;
          lookup(found[0].rawValue);
          return;
        }
        requestAnimationFrame(tick);
      };
      tick();
    }catch(err){ msg.textContent="Camera unavailable. Type or paste the number instead."; }
  });
}
</script>
</body>
</html>
